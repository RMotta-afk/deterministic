[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deterministic"
version = "0.1.0"
description = "Paired graph and vector memory benchmark for code migration"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.4,<3",
    "pydantic>=2.14,<3",
    "falkordb>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "tiktoken==0.12.0",
]

[dependency-groups]
dev = ["pre-commit>=4,<5", "pytest>=9,<10", "ruff==0.17.3"]

[project.scripts]
deterministic = "deterministic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deterministic"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["fixtures", "metrics"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
